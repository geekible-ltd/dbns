[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Internal crates (spec §29 — initial iteration only)
ndb-common = { path = "crates/ndb-common" }
ndb-config = { path = "crates/ndb-config" }

# Error handling
thiserror = "2"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# HTTP / API (Phase 8)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.13"
prost-build = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1"
futures = "0.3"
tokio-stream = "0.1"
http = "1"

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

# Logging / metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.17"

# CLI
clap = { version = "4", features = ["derive"] }

# Checksums
crc32fast = "1"

# Testing
proptest = "1"
tempfile = "3"
